<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabbage Coins — Listing Layout Mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Serif+Display&display=swap">
<style>
/* ============================================================
   MOCKUP CHROME  (this bar is NOT part of the design — it is
   just the control panel for comparing options)
   ============================================================ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; background: #fff; }

#mockbar {
  position: sticky; top: 0; z-index: 999;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: #12203a; color: #cfe0f7;
  border-bottom: 3px solid #c99b45;
  font-size: 13px;
}
#mockbar .brand { font-weight: 700; letter-spacing: .04em; margin-right: 8px; color: #f0dcab; }
#mockbar button {
  font: inherit; font-weight: 600; cursor: pointer;
  padding: 7px 13px; border-radius: 7px;
  border: 1px solid #3a5a8c;
  background: #1d3961; color: #cfe0f7;
}
#mockbar button:hover { background: #274a7d; }
#mockbar button.on { background: #c99b45; border-color: #e8c987; color: #21170a; }
#mockbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
#mockbar .spacer { flex: 1; }
#mockbar .readout { font-variant-numeric: tabular-nums; opacity: .85; }

.optnote {
  max-width: 900px; margin: 0 auto 4px; padding: 14px 18px;
  background: #fffbea; border: 1px solid #e8d9a8; border-left: 5px solid #c99b45;
  border-radius: 10px; font-size: 15px; line-height: 1.55; color: #4a3f22;
}
.optnote b { color: #7a5c14; }
.mockwrap { padding: 26px 0 60px; }
.hide { display: none !important; }

/* ============================================================
   SITE CHROME  (approximates the real cabbage-coins.com header)
   ============================================================ */
.cc-head { padding: 20px; background: linear-gradient(0deg, rgba(30,58,99,1) 0%, rgba(88,125,179,1) 100%); text-align: center; }
.cc-head img { max-width: 420px; width: 100%; padding: 10px; }
.cc-nav { background: #fff; box-shadow: 0 0 10px 5px rgba(0,0,0,.185); padding: 12px; text-align: center; }
.cc-nav a { color: #2196f3; text-decoration: none; font-size: 17px; padding: 8px 22px; display: inline-block; }
.cc-nav a.active { color: #1d3961; font-weight: 500; }

/* ============================================================
   SHARED LISTING PIECES
   ============================================================ */
.cc-title {
  font-family: 'Noto Serif Display', Georgia, serif; font-weight: 800;
  color: #1d3961; font-size: 38px; line-height: 1.18; margin: 0 0 16px; text-wrap: balance;
}
.cc-price-row { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid #e6ebf1; margin-bottom: 6px; }
.cc-price { font-weight: 700; font-size: 40px; color: #2c3a4d; }
.cc-status { font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #2e7d52; background: #e7f5ec; padding: 4px 10px; border-radius: 20px; }
.cc-spec { display: flex; justify-content: space-between; align-items: center; padding: 15px 2px; border-bottom: 1px solid #e6ebf1; }
.cc-spec-label { font-size: 15px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: #5f6b7a; }
.cc-spec-value { font-size: 20px; font-weight: 700; color: #1d3961; text-align: right; }
.cc-badge-row { display: flex; align-items: center; gap: 14px; margin: 20px 0 24px; }
.cc-cac-badge { height: 52px; }
.cc-cac-text { font-size: 16px; color: #5f6b7a; }
.cc-inquire-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: #1d3961; color: #fff; font-family: 'Noto Serif Display', Georgia, serif;
  font-size: 20px; letter-spacing: .04em; border: none; border-radius: 10px;
  padding: 16px 38px; cursor: pointer; box-shadow: 0 4px 12px rgba(29,57,97,.28);
}
.cc-tony-says { margin: 28px 0 0; padding: 20px 25px; background: #f5f8fb; border: 1px solid #e6ebf1; border-left: 5px solid #1d3961; border-radius: 12px; }
.cc-tony-head { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
.cc-tony-emblem { height: 38px; width: 38px; object-fit: contain; }
.cc-tony-title { font-family: 'Noto Serif Display', Georgia, serif; font-weight: 800; color: #1d3961; font-size: 24px; margin: 0; }
.cc-tony-body { font-size: 19px; line-height: 1.6; color: #2c3a4d; margin: 0; }
.cc-coin-caption { text-align: center; font-style: italic; color: #7c8aa0; font-size: 18px; margin: 6px 0 4px; }

.cc-feature-banner { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 13px 20px; background: linear-gradient(90deg,#1d3961,#274a7d,#1d3961); }
.cc-fb-star { color: #e8c987; font-size: 15px; }
.cc-fb-title { font-family: 'Noto Serif Display', Georgia, serif; font-weight: 700; margin: 0; font-size: 15px; letter-spacing: .28em; text-transform: uppercase; color: #f0dcab; }
.cc-featured-frame { padding: 9px; border-radius: 26px; background: linear-gradient(145deg,#e8c987,#c99b45 40%,#a97f2f 70%,#e8c987); box-shadow: 0 20px 60px rgba(29,57,97,.28); margin: 0 auto; }
/* when framed, the card fills the frame instead of centring inside it */
.cc-featured-frame > .card { max-width: none !important; margin: 0 !important; border-radius: 18px; box-shadow: inset 0 0 0 1px #c99b45; }

/* the coin photo itself */
.coin {
  display: block; width: 100%; height: auto;
  border-radius: 16px; border: 3px solid #1d3961;
  box-shadow: 0 6px 16px rgba(0,0,0,.25);
  background: #0b0b0b;
}

/* ============================================================
   OPTION  0 — CURRENT DESIGN (for reference)
   ============================================================ */
#opt0 .card { max-width: 1080px; margin: 0 auto; background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; box-shadow: 0 12px 40px rgba(29,57,97,.10); overflow: hidden; text-align: left; }
#opt0 .grid { display: grid; grid-template-columns: 1fr 1fr; }
#opt0 .imgcol { padding: 32px; background: #f5f8fb; border-right: 1px solid #e6ebf1; }
#opt0 .imgcol .coin { margin-bottom: 16px; }
#opt0 .thumbrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
#opt0 .thumbrow .coin { border-width: 2px; border-radius: 12px; margin: 0; }
#opt0 .infocol { padding: 36px 38px; }

/* ============================================================
   OPTION  A — FULL-BLEED STACK   (closest to Rarity7)
   ============================================================ */
#optA .wrap { max-width: none; padding: 0 22px; }
/* image column capped at 780px: past that we would be upscaling the 1044px master */
#optA .grid { display: grid; grid-template-columns: minmax(0, 780px) minmax(340px, 640px); gap: 54px; align-items: start; justify-content: start; }
#optA .imgcol { display: flex; flex-direction: column; gap: 18px; }
#optA .imgcol .coin { border-radius: 10px; border-width: 2px; box-shadow: 0 3px 10px rgba(0,0,0,.16); }
#optA .infocol { position: sticky; top: 64px; text-align: left; }
#optA .crumbs { padding: 14px 22px 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #7c8aa0; }
#optA .crumbs a { color: #7c8aa0; text-decoration: none; }

/* ============================================================
   OPTION  B — WIDE CARD + STACK   (Rarity7 size, Cabbage frame)
   ============================================================ */
/* 1460px card => image column tops out near 760px, just under the 1044px master */
#optB .card { max-width: 1460px; margin: 0 auto; background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; box-shadow: 0 12px 40px rgba(29,57,97,.10); overflow: hidden; text-align: left; }
#optB .grid { display: grid; grid-template-columns: minmax(0, 56%) minmax(340px, 1fr); }
#optB .imgcol { padding: 30px; background: #f5f8fb; border-right: 1px solid #e6ebf1; display: flex; flex-direction: column; gap: 18px; }
#optB .infocol { padding: 40px 44px; align-self: start; position: sticky; top: 22px; }

/* ============================================================
   OPTION  C — WIDE CARD + 2x2 GRID  (all four above the fold)
   ============================================================ */
#optC .card { max-width: 1560px; margin: 0 auto; background: #fff; border: 1px solid #e6ebf1; border-radius: 20px; box-shadow: 0 12px 40px rgba(29,57,97,.10); overflow: hidden; text-align: left; }
#optC .grid { display: grid; grid-template-columns: minmax(0, 60%) minmax(340px, 1fr); }
#optC .imgcol { padding: 30px; background: #f5f8fb; border-right: 1px solid #e6ebf1; }
#optC .quad { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
#optC .infocol { padding: 40px 44px; align-self: start; position: sticky; top: 22px; }

/* ---- measurement chip shown under each option ---- */
.measure {
  margin: 28px auto 0; max-width: 900px; padding: 12px 16px;
  background: #eef4fb; border: 1px dashed #9db8d8; border-radius: 10px;
  font-size: 14px; color: #24405f; line-height: 1.6;
}
.measure b { font-variant-numeric: tabular-nums; }
.measure .warn { color: #a3521c; font-weight: 600; }
.measure .ok { color: #2e7d52; font-weight: 600; }

/* ---- mobile ---- */
@media (max-width: 900px) {
  #opt0 .grid, #optA .grid, #optB .grid, #optC .grid { grid-template-columns: 1fr; gap: 0; }
  #optA .infocol, #optB .infocol, #optC .infocol { position: static; }
  #opt0 .imgcol, #optB .imgcol, #optC .imgcol { border-right: none; border-bottom: 1px solid #e6ebf1; }
  #optA .wrap { padding: 0 12px; }
  #optA .imgcol { margin-bottom: 26px; }
  .cc-title { font-size: 30px; }
  #opt0 .infocol, #optB .infocol, #optC .infocol { padding: 26px 22px; }
  #optC .quad { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="mockbar">
  <span class="brand">LISTING LAYOUT MOCKUP</span>
  <button data-opt="0">Current</button>
  <button data-opt="A" class="on">A · Full-bleed stack</button>
  <button data-opt="B">B · Wide card + stack</button>
  <button data-opt="C">C · Wide card + 2&times;2</button>
  <label><input type="checkbox" id="featToggle" checked> gold “featured” frame</label>
  <span class="spacer"></span>
  <span class="readout" id="readout"></span>
</div>

<div class="mockwrap">
  <div class="optnote" id="optnote"></div>
</div>

<!-- ===================== SITE CHROME ===================== -->
<div class="cc-head"><img src="../web/assets/img/Cabbage%20Coins_White.png" alt="Cabbage Coins"></div>
<div class="cc-nav">
  <a href="#">Home</a><a href="#" class="active">Inventory</a><a href="#">Sell To Us</a><a href="#">FAQs</a><a href="#">About Cabbage Coins</a>
</div>

<!-- ===================== OPTIONS ===================== -->
<div id="stage" style="padding: 34px 0 70px; background:#fff;"></div>

<div class="measure" id="measure"></div>

<script>
/* ------------------------------------------------------------------
   Real data pulled from the live Sanity dataset (1902-S Barber Half).
   Images are requested with q=90 + auto=format — see item 4 notes.
   ------------------------------------------------------------------ */
var BASE = 'https://cdn.sanity.io/images/la880an7/production/';
var COIN = {
  name: '1902-S 50C Barber Half Dollar PCGS MS66+ CAC',
  price: '15000',
  caption: 'Key Date Barber Half in MS66+ CAC!!',
  dateshown: '1902-S', gradingCompany: 'PCGS', gradenumber: '35693898',
  grade: 'MS66+ CAC', pcgs: '6494', cac: true,
  tony: 'This is honestly one of my favorite coins on the website release for early August. The 1902-S is a key date in the Barber Half series and this at the MS66+ grade which is monumental. Even though the mintage was 1.4 million, most got heavily circulated leaving Superb Gem examples extremely rare. According to PCGS, there are only 4 finer known in existence. Given the demand for nice quality, CAC-approved examples of Barber half dollars, I can only see a strong future in store from a value perspective. The coin exhibits lovely bluish toning with golden accents at the periphery and has a needle-sharp strike.',
  imgs: [
    BASE + '3cce058b3432d34e31d84c58bfefea629c41a48e-1044x1044.jpg',
    BASE + 'c4ba770332c715d017eded1efa33777cf38df8eb-1044x1044.jpg',
    BASE + '0e130d55bd434408de271fc41e3872657131df26-1044x1044.jpg',
    BASE + '920f2c2fefbbb1cd4086af120ffdd28146e10975-1044x1044.jpg'
  ],
  alts: ['obverse', 'reverse', 'slab front', 'slab back']
};
var MASTER_PX = 1044;                 // every master in the dataset is 1044x1044
function src(u) { return u + '?w=1044&q=90&auto=format&fit=max'; }
function img(i, cls) {
  return '<img class="coin ' + (cls || '') + '" src="' + src(COIN.imgs[i]) + '" alt="' + COIN.name + ' ' + COIN.alts[i] + '">';
}

/* ---------- shared info-column markup ---------- */
function info() {
  return ''
  + '<h1 class="cc-title">' + COIN.name + '</h1>'
  + '<div class="cc-price-row"><span class="cc-price">$' + COIN.price + '</span><span class="cc-status">Available</span></div>'
  + spec('Issue', COIN.dateshown)
  + spec('Grading Company', COIN.gradingCompany)
  + spec('Certification #', COIN.gradenumber)
  + spec('Grade', COIN.grade)
  + spec('PCGS Catalog #', COIN.pcgs)
  + '<div class="cc-badge-row"><img class="cc-cac-badge" src="../web/assets/img/caccoin.png" alt="CAC verified"><span class="cc-cac-text">CAC verified — green sticker</span></div>'
  + '<button class="cc-inquire-btn">&#9993; Inquire</button>';
}
function spec(l, v) {
  return '<div class="cc-spec"><span class="cc-spec-label">' + l + '</span><span class="cc-spec-value">' + v + '</span></div>';
}
function tony(extraClass) {
  return '<div class="cc-tony-says ' + (extraClass || '') + '">'
    + '<div class="cc-tony-head"><img class="cc-tony-emblem" src="../web/assets/img/CabbageCoins_Emblem_Small.png" alt=""><h3 class="cc-tony-title">Tony says ...</h3></div>'
    + '<div class="cc-tony-body">' + COIN.tony + '</div></div>';
}
function banner() {
  return '<div class="cc-feature-banner"><span class="cc-fb-star">&#9733;</span><h2 class="cc-fb-title">Featured Listing</h2><span class="cc-fb-star">&#9733;</span></div>';
}
function frame(inner, on, maxw) {
  return on ? '<div class="cc-featured-frame" style="max-width:' + maxw + 'px">' + inner + '</div>' : inner;
}

/* ---------- the four layouts ---------- */
var LAYOUTS = {

  '0': function (feat) {
    var card = '<div class="card">' + (feat ? banner() : '')
      + '<div class="grid">'
      +   '<div class="imgcol">' + img(0) + img(1)
      +     '<div class="cc-coin-caption">“' + COIN.caption + '”</div>'
      +     '<div class="thumbrow">' + img(2) + img(3) + '</div>'
      +   '</div>'
      +   '<div class="infocol">' + info() + (feat ? '' : tony()) + '</div>'
      + '</div>'
      + (feat ? '<div style="padding:30px 40px 34px;background:linear-gradient(180deg,#fbfcfe,#f2f6fb);border-top:1px solid #e6ebf1;border-left:6px solid #c99b45;">' + tony().replace(/class="cc-tony-says [^"]*"/, 'style="margin:0;padding:0;background:none;border:none"') + '</div>' : '')
      + '</div>';
    return '<div id="opt0">' + frame(card, feat, 1080) + '</div>';
  },

  'A': function (feat) {
    return '<div id="optA"><div class="wrap">'
      + '<div class="crumbs"><a href="#">Home</a> / <a href="#">Inventory</a> / ' + COIN.name + '</div>'
      + (feat ? '<div style="margin:0 0 16px;border-radius:8px;overflow:hidden">' + banner() + '</div>' : '')
      + '<div class="grid">'
      +   '<div class="imgcol">'
      +     img(0)
      +     '<div class="cc-coin-caption" style="margin:-4px 0 0">“' + COIN.caption + '”</div>'
      +     img(1) + img(2) + img(3)
      +   '</div>'
      +   '<div class="infocol">' + info() + tony() + '</div>'
      + '</div></div></div>';
  },

  'B': function (feat) {
    var card = '<div class="card">' + (feat ? banner() : '')
      + '<div class="grid">'
      +   '<div class="imgcol">'
      +     img(0)
      +     '<div class="cc-coin-caption" style="margin:-6px 0 -4px">“' + COIN.caption + '”</div>'
      +     img(1) + img(2) + img(3)
      +   '</div>'
      +   '<div class="infocol">' + info() + tony() + '</div>'
      + '</div></div>';
    return '<div id="optB">' + frame(card, feat, 1460) + '</div>';
  },

  'C': function (feat) {
    var card = '<div class="card">' + (feat ? banner() : '')
      + '<div class="grid">'
      +   '<div class="imgcol"><div class="quad">' + img(0) + img(1) + img(2) + img(3) + '</div>'
      +     '<div class="cc-coin-caption">“' + COIN.caption + '”</div></div>'
      +   '<div class="infocol">' + info() + tony() + '</div>'
      + '</div></div>';
    return '<div id="optC">' + frame(card, feat, 1560) + '</div>';
  }
};

var NOTES = {
  '0': '<b>Current design.</b> 1080px card, two big shots stacked plus two small slab thumbnails you have to click. On a 1920px monitor roughly 44% of the screen is empty margin, and the coin photo renders about 466px wide.',
  'A': '<b>Option A — full-bleed stack.</b> The closest match to Rarity7: no card, no wasted side margin, all four shots the same big size, info panel sticks to the right as you scroll. Image column is capped at <b>780px</b> — past that we would be upscaling your 1044px master and it would go soft, which is also why Rarity7 stops around 700px and leaves the right side empty. Biggest photos of the three, but it drops the white card and the gold featured frame becomes a plain banner.',
  'B': '<b>Option B — wide card + stack.</b> Rarity7’s image size with your card, navy border and gold featured frame kept intact. Card widens 1080 → 1460px, which lands the photos around <b>760px</b> — right at the limit of your master files. All four stacked at full column width, info panel sticky on the right. <b>This is the one I’d ship.</b>',
  'C': '<b>Option C — wide card + 2&times;2.</b> All four visible without scrolling — but be warned, each one lands around <b>430px</b> on a normal monitor, which is actually <i>smaller</i> than your current main photo. It solves the “two tiny thumbnails” problem but not the “make the coin big” problem.'
};

var cur = 'A', feat = true;
function render() {
  document.getElementById('stage').innerHTML = LAYOUTS[cur](feat);
  document.getElementById('optnote').innerHTML = NOTES[cur];
  [].forEach.call(document.querySelectorAll('#mockbar button'), function (b) {
    b.classList.toggle('on', b.dataset.opt === cur);
  });
  measure();
}
function measure() {
  var first = document.querySelector('#stage .coin');
  if (!first) return;
  var w = Math.round(first.getBoundingClientRect().width);
  var vw = window.innerWidth;
  var dpr = window.devicePixelRatio || 1;
  var need = Math.round(w * dpr);
  var ratio = (MASTER_PX / need);
  var verdict = need <= MASTER_PX
    ? '<span class="ok">master is big enough here (' + MASTER_PX + 'px available, ' + need + 'px needed)</span>'
    : '<span class="warn">master is too small here — needs ' + need + 'px, you only have ' + MASTER_PX + 'px, so it will look soft on this screen</span>';
  document.getElementById('measure').innerHTML =
      'Viewport <b>' + vw + 'px</b> &nbsp;·&nbsp; device pixel ratio <b>' + dpr + '&times;</b> &nbsp;·&nbsp; '
    + 'main coin photo renders at <b>' + w + 'px</b> wide &nbsp;·&nbsp; ' + verdict
    + '<br>Every image in your Sanity dataset is a <b>1044 &times; 1044</b> JPEG. That is the hard ceiling on how big these can go before they soften. '
    + 'Rarity7 is displaying at a similar size but almost certainly from a 2000px+ master.';
}
document.getElementById('mockbar').addEventListener('click', function (e) {
  if (e.target.dataset && e.target.dataset.opt) { cur = e.target.dataset.opt; render(); }
});
document.getElementById('featToggle').addEventListener('change', function (e) { feat = e.target.checked; render(); });
window.addEventListener('resize', measure);
render();
</script>
</body>
</html>
